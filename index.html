<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacau pela Bahia - Liderança: Bruno de Oliveira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bibliotecas para geração de PDF e AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .progress-bar { background-color: #1e293b; height: 6px; border-radius: 9999px; overflow: hidden; }
        .progress-fill { background-color: #3b82f6; height: 100%; border-radius: 9999px; }
        .city-row { transition: all 0.2s ease; cursor: pointer; }
        .city-row:hover { background-color: #1f2937; transform: translateX(2px); }

        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .pdf-table th { background-color: #0f172a; color: #ffffff; font-size: 8pt; font-weight: bold; text-transform: uppercase; padding: 7px 8px; text-align: left; border: 1px solid #0f172a; }
        .pdf-table td { padding: 6px 8px; border-bottom: 1px solid #cbd5e1; font-size: 8.5pt; vertical-align: middle; color: #0f172a; }
        .pdf-table tr:nth-child(even) { background-color: #f8fafc; }
        .badge-pdf-code { font-family: monospace; font-weight: bold; color: #0369a1; }
    </style>
</head>
<body class="p-4 max-w-lg mx-auto space-y-5 pb-24">

    <div id="conteudoPrincipal" class="space-y-5">
        <header class="flex justify-between items-center py-2">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white">
                    <i class="fa-solid fa-users text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight">Cacau pela Bahia</h1>
                    <p class="text-xs text-amber-500 font-medium">Liderança: Bruno de Oliveira</p>
                </div>
            </div>
            
            <div class="flex gap-1.5">
                <button type="button" onclick="abrirConsultaTSE()" title="Consulta TSE" class="bg-sky-600 hover:bg-sky-500 p-2 rounded-lg text-white text-xs transition flex items-center gap-1 font-bold">
                    <i class="fa-solid fa-scale-balanced"></i>
                </button>
                <button type="button" onclick="exportarDados()" title="Gerar Código Backup" class="bg-amber-600 hover:bg-amber-500 p-2 rounded-lg text-white text-xs transition">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button type="button" onclick="importarCodigoBackup()" title="Colar Código Backup" class="bg-purple-600 hover:bg-purple-500 p-2 rounded-lg text-white text-xs transition">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <button type="button" onclick="abrirTelaRelatorio(false)" title="Relatório Geral" class="bg-emerald-600 hover:bg-emerald-500 p-2 rounded-lg text-white text-xs transition flex items-center gap-1 font-bold">
                    <i class="fa-solid fa-file-lines"></i>
                </button>
            </div>
        </header>

        <section class="card-dark p-4 rounded-2xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-amber-500 tracking-wider flex items-center gap-1.5 uppercase">
                    <i class="fa-solid fa-filter"></i> CONFRONTO DE SEÇÃO & ZONA
                </h2>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold uppercase">FILTRAR ZONA</label>
                    <select id="filtroZonaSelect" onchange="filtrarEleitores()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-300 font-medium focus:outline-none">
                        <option value="">Todas as Zonas</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold uppercase">FILTRAR SEÇÃO</label>
                    <select id="filtroSecaoSelect" onchange="filtrarEleitores()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-emerald-400 font-medium focus:outline-none">
                        <option value="">Todas as Seções</option>
                    </select>
                </div>
            </div>
        </section>
