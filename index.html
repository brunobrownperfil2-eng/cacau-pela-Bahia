<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacau pela Bahia - Liderança: Bruno de Oliveira</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JSZip para Backup .ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .progress-bar { background-color: #374151; }
        .progress-fill { background-color: #10b981; }
        .modal { transition: opacity 0.2s ease-in-out; }
        .modal-hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Cabeçalho com Título e Botões Principais -->
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="p-3 bg-blue-600 rounded-xl">
                <i class="fas fa-users text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Cacau pela Bahia</h1>
                <p class="text-xs text-amber-500 font-medium">Liderança: Bruno de Oliveira</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Botão TSE (Redirecionamento Direto) -->
            <button onclick="abrirTSE()" class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition" title="Consultar TSE">
                <i class="fas fa-scale-balanced text-lg"></i>
            </button>

            <!-- Botão Backup (Download .zip) -->
            <button onclick="exportarBackup()" class="p-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg transition" title="Exportar Backup">
                <i class="fas fa-download text-lg"></i>
            </button>

            <!-- Botão Restaurar Backup -->
            <label class="p-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg cursor-pointer transition" title="Restaurar Backup">
                <i class="fas fa-upload text-lg"></i>
                <input type="file" id="importInput" onchange="importarBackup(event)" class="hidden" accept=".zip">
            </label>

            <!-- Botão Compartilhar WhatsApp -->
            <button onclick="compartilharWhatsApp()" class="p-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition" title="Compartilhar WhatsApp">
                <i class="fab fa-whatsapp text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="max-w-4xl mx-auto card-dark rounded-xl p-4">
        <h2 class="text-amber-500 font-bold text-sm tracking-wider uppercase mb-4">
            <i class="fas fa-filter mr-2"></i>Confronto de Seção & Zona
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">FILTRAR ZONA</label>
                <select class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Todas as Zonas</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">FILTRAR SEÇÃO</label>
                <select class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Todas as Seções</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Script de Funcionamento dos Botões -->
    <script>
        // Função do Botão TSE
        function abrirTSE() {
            window.open("https://www.tse.jus.br/servicos-eleitorais/titulo-e-local-de-votacao/consulta-por-nome", "_blank");
        }

        // Função do Botão WhatsApp
        function compartilharWhatsApp() {
            const mensagem = encodeURIComponent("Acesse o sistema Cacau pela Bahia - GeoPolítico BA: https://brunobrownperfil2-eng.github.io/cacau-pela-Bahia/");
            window.open(`https://api.whatsapp.com/send?text=${mensagem}`, "_blank");
        }

        // Função de Exportar Backup em .ZIP
        async function exportarBackup() {
            if (typeof JSZip === "undefined") {
                alert("Aguarde a biblioteca carregar totalmente.");
                return;
            }
            const zip = new JSZip();
            const dados = {};
            for (let i = 0; i < localStorage.length; i++) {
                const chave = localStorage.key(i);
                dados[chave] = localStorage.getItem(chave);
            }
            zip.file("backup_cacau_bahia.json", JSON.stringify(dados, null, 2));
            const conteudo = await zip.generateAsync({ type: "blob" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(conteudo);
            a.download = `backup_cacau_bahia_${new Date().toISOString().slice(0,10)}.zip`;
            a.click();
        }

        // Função de Importar Backup em .ZIP
        async function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;
            try {
                const zip = await JSZip.loadAsync(arquivo);
                const jsonFile = zip.file("backup_cacau_bahia.json");
                if (!jsonFile) {
                    alert("Arquivo de backup inválido!");
                    return;
                }
                const texto = await jsonFile.async("string");
                const dados = JSON.parse(texto);
                Object.keys(dados).forEach(chave => localStorage.setItem(chave, dados[chave]));
                alert("Backup restaurado com sucesso!");
                location.reload();
            } catch (e) {
                alert("Erro ao ler o arquivo de backup.");
            }
        }
    </script>
</body>
</html>
